<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunes Lab</title>
<style>
:root { color-scheme:dark; --bg:#0d1012; --panel:#14181b; --raised:#1b2024; --line:#272e33; --ink:#e7ebec; --muted:#8e9aa0;
        --quiet:#5f6b71; --ok:#4cc38a; --warn:#f0b64a; --bad:#f06a63; --accent:#6db3f2; --ch1:#f5dc28; --ch2:#3cc8f0;
        --mono:ui-monospace, "Cascadia Mono", Consolas, monospace; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI", system-ui, sans-serif;
       display:grid; grid-template-rows:auto auto minmax(0,1fr); }
h1, h2, h3, p { margin:0; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

.top { display:flex; align-items:center; gap:20px; padding:10px 16px; border-bottom:1px solid var(--line); min-width:0; }
.brand { display:flex; align-items:baseline; gap:10px; flex:none; }
.brand h1 { font-size:18px; font-weight:650; letter-spacing:.01em; }
.brand span { color:var(--muted); font-size:13px; }
.activity { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.state { flex:none; display:flex; align-items:center; gap:7px; padding:3px 10px; border:1px solid var(--line); border-radius:6px;
         font-size:13px; font-weight:600; color:var(--muted); }
.state i { width:8px; height:8px; border-radius:50%; background:var(--quiet); }
.state[data-on="listening"] { color:var(--ink); } .state[data-on="listening"] i { background:var(--ok); }
.state[data-on="working"] { color:var(--warn); border-color:#5a4a26; } .state[data-on="working"] i { background:var(--warn); }
.state[data-on="speaking"] { color:var(--accent); border-color:#2d4a63; } .state[data-on="speaking"] i { background:var(--accent); }
.status { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.clock { flex:none; color:var(--muted); font-size:13px; }
.lang, .fit { flex:none; border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; }
.lang:hover, .fit:hover { color:var(--ink); }
.fit.apply { color:var(--accent); border-color:#2d4a63; }
.mic { flex:none; display:flex; align-items:center; gap:6px; padding:3px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-weight:600; color:var(--ink); }
.mic svg { flex:none; } .mic .slash { display:none; }
.mic[data-on="false"] { color:var(--bad); border-color:#5a2a28; background:rgba(240,106,99,.08); } .mic[data-on="false"] .slash { display:block; }
.mic:disabled { color:var(--quiet); cursor:default; }

.strip { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:7px 16px; border-bottom:1px solid var(--line);
         font-size:12.5px; color:var(--muted); }
.strip .group { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.strip .group + .group { padding-left:18px; border-left:1px solid var(--line); }
.chip { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.chip i { width:7px; height:7px; border-radius:50%; background:var(--quiet); }
.chip.on { color:var(--ink); } .chip.on i { background:var(--ok); }
.chip.warn { color:var(--warn); } .chip.warn i { background:var(--warn); }
.model { white-space:nowrap; } .model.on { color:var(--ink); }
.model small { color:var(--quiet); font-size:11.5px; margin-left:3px; }

/* the panels' shares of the big layout live in these variables, so a border dragged (see "layout" in the script) and a
   kept layout change them without touching the narrow layouts below, which set their own templates */
main { display:grid; gap:10px; padding:10px; min-height:0; --c1:1.6fr; --c2:.86fr; --c3:.94fr; --r1:1.2fr; --r2:1fr;
       grid-template-columns:minmax(0,var(--c1)) minmax(290px,var(--c2)) minmax(320px,var(--c3));
       grid-template-rows:minmax(0,var(--r1)) minmax(0,var(--r2));
       grid-template-areas:"view machine talk" "scope bench talk"; }
body[data-resize] { user-select:none; } body[data-resize="col"], body[data-resize="col"] * { cursor:col-resize !important; }
body[data-resize="row"], body[data-resize="row"] * { cursor:row-resize !important; } body[data-resize="both"], body[data-resize="both"] * { cursor:move !important; }
.panel { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:8px; min-height:0; min-width:0;
         display:flex; flex-direction:column; overflow:hidden; }
.panel.floating { position:fixed; inset:4vh 5vw; z-index:40; box-shadow:0 24px 70px rgba(0,0,0,.65); border-color:#3d4a52; }
.veil { position:fixed; inset:0; z-index:39; background:rgba(4,6,8,.62); }
.grow { position:absolute; top:6px; right:7px; z-index:6; width:26px; height:26px; border-radius:5px; border:1px solid var(--line);
        background:rgba(14,18,20,.86); color:var(--muted); font-size:15px; line-height:1; }
.grow:hover { color:var(--ink); border-color:var(--accent); }
.panel > .head { padding-right:42px; }
.zoomed { cursor:grab; } .zoomed:active { cursor:grabbing; }
.zoombox { overflow:hidden; touch-action:none; }
.tip { position:fixed; z-index:60; max-width:340px; padding:7px 10px; border-radius:6px; border:1px solid #3d4a52; background:#10161a;
       color:var(--ink); font-size:12.5px; line-height:1.45; white-space:pre-line; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.5); }
.tip b { color:var(--accent); font-weight:650; }
.panel.floating .breadboard svg { max-height:calc(92vh - 150px); }
.head { flex:none; display:flex; align-items:center; gap:10px; min-height:37px; padding:7px 12px; border-bottom:1px solid var(--line); }
.head h2 { font-size:13px; font-weight:600; }
.head .side { margin-left:auto; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tag { font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--warn); border:1px solid #5a4a26; border-radius:4px; padding:0 5px; }
.live { font:inherit; font-size:11.5px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:4px; padding:1px 7px; cursor:pointer; }
.live:hover { color:var(--ink); }
.live.on { color:var(--ink); border-color:#b33; }
.live.on::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#e33; margin-right:5px; animation:blink 1s step-end infinite; }
@keyframes blink { 50% { opacity:.25; } }
.body { flex:1; min-height:0; overflow:auto; padding:10px 12px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.empty { color:var(--quiet); font-size:13px; }

#view { grid-area:view; } #scope { grid-area:scope; } #machine { grid-area:machine; } #bench { grid-area:bench; } #talk { grid-area:talk; }
.tabs { flex:none; display:flex; border-bottom:1px solid var(--line); }
.tabs button { flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:6px 10px; color:var(--muted); font-size:13px;
               border-right:1px solid var(--line); border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button:last-child { border-right:0; }
.tabs button:hover { color:var(--ink); }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); background:var(--raised); }
.tabs img { width:42px; height:30px; object-fit:cover; border-radius:3px; background:#000; flex:none; }
.tabs span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stage { position:relative; flex:1; min-height:0; background:#000; }
.stage > img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.stage.tappable > img { cursor:crosshair; }
.chipline { flex:none; padding:5px 12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); }
.chipline b { font-family:var(--mono); color:var(--ink); } .chipline.bad { color:var(--bad); } .chipline.good { color:var(--ok); }
.caption { position:absolute; left:10px; bottom:9px; display:flex; gap:12px; padding:3px 8px; border-radius:4px;
           background:rgba(8,10,12,.78); font-size:12.5px; color:var(--ink); }
.badge { position:absolute; right:10px; top:9px; padding:2px 8px; border-radius:4px; background:rgba(8,10,12,.78);
         font-size:12px; color:var(--muted); }

.screen { flex:1; min-height:0; position:relative; background:#0a0d0f; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--quiet); font-size:13px; text-align:center; padding:12px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; font-weight:500; color:var(--muted); padding:2px 8px 2px 0; white-space:nowrap; }
td { padding:2px 8px 2px 0; white-space:nowrap; }
td.num, th.num { text-align:right; }
td.id { font-family:var(--mono); }
.measures { flex:none; padding:6px 12px; border-top:1px solid var(--line); overflow-x:auto; }
.ch1 { color:var(--ch1); font-weight:600; } .ch2 { color:var(--ch2); font-weight:600; }
.hints { flex:none; padding:0 12px 6px; color:var(--warn); font-size:12px; }

.dro { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border-bottom:1px solid var(--line); flex:none; }
.dro div { background:var(--panel); padding:6px 12px; display:flex; align-items:baseline; gap:7px; min-width:0; }
.dro b { color:var(--muted); font-size:12px; font-weight:600; }
.dro span { font-size:18px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
.map { flex:1; min-height:0; padding:8px 12px 2px; display:flex; }
.map svg { width:100%; height:100%; display:block; }
.map text { font:11px "Segoe UI", system-ui, sans-serif; fill:var(--quiet); }
.line.mind { gap:10px; font-size:12px; color:var(--muted); }
.line.mind span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line { flex:none; display:flex; align-items:center; gap:7px; padding:6px 12px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); }
.line i { width:7px; height:7px; border-radius:50%; background:var(--quiet); flex:none; }
.line.ok i { background:var(--ok); } .line.bad { color:var(--bad); font-weight:600; } .line.bad i { background:var(--bad); }

.section + .section { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.section h3 { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.name { font-weight:600; margin-bottom:3px; }
.sub { color:var(--muted); font-size:12.5px; }
.verdict { padding:7px 10px; border-radius:6px; background:#17281f; border:1px solid #27503b; font-weight:600; font-size:13px; }
.verdict.none { background:#2a2315; border-color:#5a4a26; }
.next { padding:7px 10px; border-radius:6px; background:var(--raised); border:1px solid var(--line); font-size:13px; }
.next b { color:var(--accent); font-family:var(--mono); }
.bar { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:2px 8px; align-items:center; margin-bottom:6px; font-size:12.5px; }
.bar .say { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.bar .p { text-align:right; font-family:var(--mono); color:var(--muted); }
.bar .track { grid-column:1 / -1; height:4px; border-radius:2px; background:var(--raised); overflow:hidden; }
.bar .track i { display:block; height:100%; background:var(--accent); }
.bar.top .track i { background:var(--ok); }
td.good { color:var(--ok); } td.off { color:var(--bad); }
.power { flex:none; display:flex; align-items:center; gap:10px; padding:6px 12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); }
.power b { font:600 15px var(--mono); color:#ff6b57; }
.power.bad { color:var(--bad); font-weight:600; }
.breadboard svg { display:block; width:100%; height:auto; background:#f2efe6; border-radius:4px; }
.zoomctl { display:flex; align-items:center; gap:3px; margin-left:6px; }
.zoomctl button { width:22px; height:20px; border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:14px; line-height:1; }
.zoomctl button:hover:not(:disabled) { color:var(--ink); border-color:var(--accent); } .zoomctl button:disabled { color:var(--quiet); cursor:default; }
.zoomctl span { min-width:46px; text-align:center; font-size:12px; color:var(--muted); }
.findings { margin-top:6px; display:flex; flex-direction:column; gap:3px; font-size:12.5px; }
.finding { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; align-items:baseline; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--panel); }
.finding:hover { border-color:var(--accent); } .finding i { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--quiet); }
.finding .what { font-weight:600; } .finding .advice { grid-column:2; color:var(--muted); font-size:12px; }
.finding.p1 i { background:#f06a63; } .finding.p2 i { background:#f08a3c; } .finding.p3 i { background:#f5dc28; }
svg .fault { fill:none; stroke-width:1.6; pointer-events:none; }
svg .fault.p1 { stroke:#e8352b; animation:blink .45s step-end infinite; } svg .fault.p2 { stroke:#f08a3c; animation:blink .9s step-end infinite; }
svg .fault.p3 { stroke:#e3c21a; animation:blink 1.6s step-end infinite; } svg .fault.dim { opacity:.12; animation:none; } svg .fault.hot { stroke-width:2.8; animation:none; }
.menu { position:fixed; top:12vh; left:calc(50% - 240px); width:480px; max-width:calc(100vw - 20px); max-height:76vh; z-index:45; display:flex; flex-direction:column;
        background:var(--raised); border:1px solid #3d4a52; border-radius:8px; box-shadow:0 24px 70px rgba(0,0,0,.65); }
.menu .bar { flex:none; display:flex; align-items:center; gap:10px; padding:7px 12px; border-bottom:1px solid var(--line); cursor:move; user-select:none; font-weight:600; font-size:13px; }
.menu .bar button { margin-left:auto; width:24px; height:24px; border-radius:5px; border:1px solid var(--line); color:var(--muted); } .menu .bar button:hover { color:var(--ink); border-color:var(--accent); }
.menu .list { flex:1; min-height:0; overflow:auto; padding:6px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.menu .hint { color:var(--muted); font-size:12.5px; padding:4px 6px; } .menu .hint.bad { color:var(--bad); } .menu[hidden] { display:none; }
@media (max-width:680px) { .menu { top:auto; bottom:0; left:0; width:100%; max-width:none; max-height:75vh; border-radius:10px 10px 0 0; } }
.edittools { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:6px 12px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); }
.edittools .swatch { width:16px; height:16px; border-radius:50%; border:2px solid transparent; padding:0; } .edittools .swatch.on { border-color:var(--ink); }
.edittools .live { color:var(--ink); } .edittools .live:disabled { color:var(--quiet); cursor:default; } .edittools .side.bad { color:var(--bad); }
.editresult { flex:none; max-height:28%; overflow:auto; padding:6px 12px; border-bottom:1px solid var(--line); font-size:12.5px; }
.editresult.bad { color:var(--bad); } .editresult ul { margin:2px 0 4px; padding-left:18px; } .editresult b { color:var(--muted); font-weight:600; }
.editing svg rect[data-hole] { cursor:pointer; } .editing svg rect[data-hole]:hover, .editing svg rect[data-hole].drop { fill:rgba(60,140,240,.45); }
.editing svg rect[data-hole].start { fill:rgba(240,180,60,.75); } .editing svg [data-grab] { cursor:grab; } .editing svg path[data-wire] { cursor:pointer; }
.editing svg .picked { stroke:#ff3b2e !important; stroke-width:2.2 !important; } .editing svg .ghost { pointer-events:none; }
.project { display:block; width:100%; text-align:left; padding:7px 8px; border-radius:6px; border:1px solid transparent; }
.project:hover { background:var(--panel); border-color:var(--line); } .project.now { border-color:var(--accent); }
.project .name { font-weight:600; } .project .name small { font-weight:500; color:var(--accent); margin-left:6px; }
.project .sub { color:var(--muted); font-size:12px; margin-top:2px; overflow-wrap:anywhere; }
.project .mini { margin-top:5px; } .project .mini svg { max-height:120px; }
.stepnow { padding:7px 10px; border-radius:6px; background:#2a1a1a; border:1px solid #6b2f2a; font-size:13px; margin-top:6px; }
.stepnow b { color:#ff6b57; font-family:var(--mono); }
.serial { font:12px/1.35 var(--mono); color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; max-height:7em; overflow:auto; }

#log { display:flex; flex-direction:column; gap:7px; }
.ask { flex:none; display:flex; flex-direction:column; gap:3px; padding:6px 8px; border-top:1px solid var(--line); }
.ask input { width:100%; font:inherit; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
.ask input::placeholder { color:var(--quiet); } .ask input:focus { outline:none; border-color:var(--accent); } .ask input.bad { border-color:var(--bad); }
.asknote { color:var(--bad); font-size:12px; padding:0 2px; }
.msg { max-width:92%; padding:6px 10px; border-radius:8px; overflow-wrap:anywhere; background:var(--raised); }
.msg.you { align-self:flex-end; background:#1b2f42; }
.msg.progress { color:var(--muted); background:none; padding:0 2px; }
.msg time { display:block; color:var(--quiet); font-size:11px; }
.step { display:flex; gap:7px; font:12px/1.4 var(--mono); color:var(--muted); padding:0 2px; overflow-wrap:anywhere; }
.step::before { content:""; flex:none; width:5px; height:5px; margin-top:6px; border-radius:50%; background:var(--accent); }
.detail { color:var(--quiet); font-size:12px; padding:0 2px; overflow-wrap:anywhere; }
body:not(.details) .detail { display:none; }
.toggle { color:var(--muted); font-size:12.5px; }
.toggle:hover { color:var(--ink); }

@media (max-width:1180px) {
  html, body { height:auto; } body { display:block; }
  main { grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:none;
         grid-template-areas:"view view" "scope scope" "machine bench" "talk talk"; }
  #view { height:62vh; min-height:340px; } #scope { height:420px; } #machine, #bench { height:440px; } #talk { height:70vh; }
}
@media (max-width:680px) {
  main { grid-template-columns:minmax(0,1fr); grid-template-areas:"view" "scope" "machine" "bench" "talk"; padding:8px; }
  .top { flex-wrap:wrap; gap:8px 12px; } .activity { order:3; flex-basis:100%; }
  .clock { margin-left:auto; } .brand span { display:none; }
  .tabs img { display:none; } .strip .group + .group { padding-left:0; border-left:0; }
}
</style></head>
<body>
<div class="veil" id="veil" hidden></div>
<div class="tip" id="tip" hidden></div>
<header class="top">
  <div class="brand"><h1>Lunes</h1><span data-t="subtitle"></span></div>
  <div class="activity"><div class="state" id="state" data-on="listening"><i></i><span id="stateText"></span></div>
    <button class="mic" id="mic" type="button" data-on="none" disabled aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5.6" y="1.2" width="4.8" height="8" rx="2.4" fill="currentColor"/><path d="M3.6 7.4a4.4 4.4 0 0 0 8.8 0M8 11.8v2.4M5.6 14.4h4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="slash" d="M2.4 2.4l11.2 11.2" fill="none" stroke="var(--bg)" stroke-width="3.4" stroke-linecap="round"/><path class="slash" d="M2.4 2.4l11.2 11.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Mic</span></button>
    <div class="status" id="status"></div></div>
  <button class="fit apply" id="applyLayout" type="button" data-t="applyLayout" hidden></button>
  <button class="fit" id="resetLayout" type="button" data-t="resetLayout" hidden></button>
  <a class="fit" id="report" href="/report" target="_blank" rel="noopener" data-t="report"></a>
  <div class="clock num" id="clock"></div>
  <button class="lang" id="lang" aria-label="Language"></button>
</header>
<div class="strip">
  <div class="group" id="instruments"></div>
  <div class="group" id="models"></div>
</div>
<div class="menu" id="projectsMenu" hidden><div class="bar" id="projectsBar"><span data-t="projects"></span><button type="button" id="projectsClose" aria-label="Cerrar">✕</button></div><div class="list" id="projectsList"></div></div>
<main>
  <section class="panel" id="view">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="stage" id="stage">
      <img id="big" alt="">
      <svg class="overlay" id="overlay" aria-hidden="true"></svg>
      <div class="badge" id="badge" hidden></div>
      <div class="caption num" id="caption" hidden></div>
    </div>
    <div class="chipline" id="chipline" hidden></div>
  </section>
