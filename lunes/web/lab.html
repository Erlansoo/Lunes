<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunes Lab</title>
<style>
:root { color-scheme:dark; --bg:#0d1012; --panel:#14181b; --raised:#1b2024; --line:#272e33; --ink:#e7ebec; --muted:#8e9aa0;
        --quiet:#5f6b71; --ok:#4cc38a; --warn:#f0b64a; --bad:#f06a63; --accent:#6db3f2; --ch1:#f5dc28; --ch2:#3cc8f0;
        --mono:ui-monospace, "Cascadia Mono", Consolas, monospace; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI", system-ui, sans-serif;
       display:grid; grid-template-rows:auto auto minmax(0,1fr); }
h1, h2, h3, p { margin:0; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

.top { display:flex; align-items:center; gap:20px; padding:10px 16px; border-bottom:1px solid var(--line); min-width:0; }
.brand { display:flex; align-items:baseline; gap:10px; flex:none; }
.brand h1 { font-size:18px; font-weight:650; letter-spacing:.01em; }
.brand span { color:var(--muted); font-size:13px; }
.activity { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.state { flex:none; display:flex; align-items:center; gap:7px; padding:3px 10px; border:1px solid var(--line); border-radius:6px;
         font-size:13px; font-weight:600; color:var(--muted); }
.state i { width:8px; height:8px; border-radius:50%; background:var(--quiet); }
.state[data-on="listening"] { color:var(--ink); } .state[data-on="listening"] i { background:var(--ok); }
.state[data-on="working"] { color:var(--warn); border-color:#5a4a26; } .state[data-on="working"] i { background:var(--warn); }
.state[data-on="speaking"] { color:var(--accent); border-color:#2d4a63; } .state[data-on="speaking"] i { background:var(--accent); }
.status { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.clock { flex:none; color:var(--muted); font-size:13px; }
.lang { flex:none; border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; color:var(--muted); }
.lang:hover { color:var(--ink); }

.strip { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:7px 16px; border-bottom:1px solid var(--line);
         font-size:12.5px; color:var(--muted); }
.strip .group { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.strip .group + .group { padding-left:18px; border-left:1px solid var(--line); }
.chip { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.chip i { width:7px; height:7px; border-radius:50%; background:var(--quiet); }
.chip.on { color:var(--ink); } .chip.on i { background:var(--ok); }
.chip.warn { color:var(--warn); } .chip.warn i { background:var(--warn); }
.model { white-space:nowrap; } .model.on { color:var(--ink); }
.model small { color:var(--quiet); font-size:11.5px; margin-left:3px; }

main { display:grid; gap:10px; padding:10px; min-height:0;
       grid-template-columns:minmax(0,1.6fr) minmax(290px,.86fr) minmax(320px,.94fr);
       grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);
       grid-template-areas:"view machine talk" "scope bench talk"; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; min-height:0; min-width:0;
         display:flex; flex-direction:column; overflow:hidden; }
.head { flex:none; display:flex; align-items:center; gap:10px; min-height:37px; padding:7px 12px; border-bottom:1px solid var(--line); }
.head h2 { font-size:13px; font-weight:600; }
.head .side { margin-left:auto; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tag { font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--warn); border:1px solid #5a4a26; border-radius:4px; padding:0 5px; }
.body { flex:1; min-height:0; overflow:auto; padding:10px 12px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.empty { color:var(--quiet); font-size:13px; }

#view { grid-area:view; } #scope { grid-area:scope; } #machine { grid-area:machine; } #bench { grid-area:bench; } #talk { grid-area:talk; }
.tabs { flex:none; display:flex; border-bottom:1px solid var(--line); }
.tabs button { flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:6px 10px; color:var(--muted); font-size:13px;
               border-right:1px solid var(--line); border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button:last-child { border-right:0; }
.tabs button:hover { color:var(--ink); }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); background:var(--raised); }
.tabs img { width:42px; height:30px; object-fit:cover; border-radius:3px; background:#000; flex:none; }
.tabs span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stage { position:relative; flex:1; min-height:0; background:#000; }
.stage > img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.caption { position:absolute; left:10px; bottom:9px; display:flex; gap:12px; padding:3px 8px; border-radius:4px;
           background:rgba(8,10,12,.78); font-size:12.5px; color:var(--ink); }
.badge { position:absolute; right:10px; top:9px; padding:2px 8px; border-radius:4px; background:rgba(8,10,12,.78);
         font-size:12px; color:var(--muted); }

.screen { flex:1; min-height:0; position:relative; background:#0a0d0f; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--quiet); font-size:13px; text-align:center; padding:12px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; font-weight:500; color:var(--muted); padding:2px 8px 2px 0; white-space:nowrap; }
td { padding:2px 8px 2px 0; white-space:nowrap; }
td.num, th.num { text-align:right; }
td.id { font-family:var(--mono); }
.measures { flex:none; padding:6px 12px; border-top:1px solid var(--line); overflow-x:auto; }
.ch1 { color:var(--ch1); font-weight:600; } .ch2 { color:var(--ch2); font-weight:600; }
.hints { flex:none; padding:0 12px 6px; color:var(--warn); font-size:12px; }

.dro { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border-bottom:1px solid var(--line); flex:none; }
.dro div { background:var(--panel); padding:6px 12px; display:flex; align-items:baseline; gap:7px; min-width:0; }
.dro b { color:var(--muted); font-size:12px; font-weight:600; }
.dro span { font-size:18px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
.map { flex:1; min-height:0; padding:8px 12px 2px; display:flex; }
.map svg { width:100%; height:100%; display:block; }
.map text { font:11px "Segoe UI", system-ui, sans-serif; fill:var(--quiet); }
.line { flex:none; display:flex; align-items:center; gap:7px; padding:6px 12px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); }
.line i { width:7px; height:7px; border-radius:50%; background:var(--quiet); flex:none; }
.line.ok i { background:var(--ok); } .line.bad { color:var(--bad); font-weight:600; } .line.bad i { background:var(--bad); }

.section + .section { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.section h3 { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.name { font-weight:600; margin-bottom:3px; }
.sub { color:var(--muted); font-size:12.5px; }
.verdict { padding:7px 10px; border-radius:6px; background:#17281f; border:1px solid #27503b; font-weight:600; font-size:13px; }
.verdict.none { background:#2a2315; border-color:#5a4a26; }
.next { padding:7px 10px; border-radius:6px; background:var(--raised); border:1px solid var(--line); font-size:13px; }
.next b { color:var(--accent); font-family:var(--mono); }
.bar { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:2px 8px; align-items:center; margin-bottom:6px; font-size:12.5px; }
.bar .say { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.bar .p { text-align:right; font-family:var(--mono); color:var(--muted); }
.bar .track { grid-column:1 / -1; height:4px; border-radius:2px; background:var(--raised); overflow:hidden; }
.bar .track i { display:block; height:100%; background:var(--accent); }
.bar.top .track i { background:var(--ok); }
td.good { color:var(--ok); } td.off { color:var(--bad); }
.serial { font:12px/1.35 var(--mono); color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; max-height:7em; overflow:auto; }

#log { display:flex; flex-direction:column; gap:7px; }
.msg { max-width:92%; padding:6px 10px; border-radius:8px; overflow-wrap:anywhere; background:var(--raised); }
.msg.you { align-self:flex-end; background:#1b2f42; }
.msg.progress { color:var(--muted); background:none; padding:0 2px; }
.msg time { display:block; color:var(--quiet); font-size:11px; }
.step { display:flex; gap:7px; font:12px/1.4 var(--mono); color:var(--muted); padding:0 2px; overflow-wrap:anywhere; }
.step::before { content:""; flex:none; width:5px; height:5px; margin-top:6px; border-radius:50%; background:var(--accent); }
.detail { color:var(--quiet); font-size:12px; padding:0 2px; overflow-wrap:anywhere; }
body:not(.details) .detail { display:none; }
.toggle { color:var(--muted); font-size:12.5px; }
.toggle:hover { color:var(--ink); }

@media (max-width:1180px) {
  html, body { height:auto; } body { display:block; }
  main { grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:none;
         grid-template-areas:"view view" "scope scope" "machine bench" "talk talk"; }
  #view { height:62vh; min-height:340px; } #scope { height:420px; } #machine, #bench { height:440px; } #talk { height:70vh; }
}
@media (max-width:680px) {
  main { grid-template-columns:minmax(0,1fr); grid-template-areas:"view" "scope" "machine" "bench" "talk"; padding:8px; }
  .top { flex-wrap:wrap; gap:8px 12px; } .activity { order:3; flex-basis:100%; }
  .clock { margin-left:auto; } .brand span { display:none; }
  .tabs img { display:none; } .strip .group + .group { padding-left:0; border-left:0; }
}
</style></head>
<body>
<header class="top">
  <div class="brand"><h1>Lunes</h1><span data-t="subtitle"></span></div>
  <div class="activity"><div class="state" id="state" data-on="listening"><i></i><span id="stateText"></span></div>
    <div class="status" id="status"></div></div>
  <div class="clock num" id="clock"></div>
  <button class="lang" id="lang" aria-label="Language"></button>
</header>
<div class="strip">
  <div class="group" id="instruments"></div>
  <div class="group" id="models"></div>
</div>
<main>
  <section class="panel" id="view">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="stage" id="stage">
      <img id="big" alt="">
      <svg class="overlay" id="overlay" aria-hidden="true"></svg>
      <div class="badge" id="badge" hidden></div>
      <div class="caption num" id="caption" hidden></div>
    </div>
  </section>

  <section class="panel" id="scope">
    <div class="head"><h2 data-t="scope"></h2><span class="tag" id="scopeSim" hidden></span><span class="side num" id="scopeInfo"></span></div>
    <div class="screen"><canvas id="trace"></canvas><div class="note" id="scopeNote"></div></div>
    <div class="measures" id="measures" hidden></div>
    <div class="hints" id="hints" hidden></div>
  </section>

  <section class="panel" id="machine">
    <div class="head"><h2 data-t="machine"></h2><span class="side" id="mosaics"></span></div>
    <div class="dro"><div><b>X</b><span id="dx">—</span></div><div><b>Y</b><span id="dy">—</span></div><div><b>Z</b><span id="dz">—</span></div></div>
    <div class="map"><svg id="map" role="img"></svg></div>
    <div class="line" id="check"><i></i><span></span></div>
  </section>

  <section class="panel" id="bench">
    <div class="head"><h2 data-t="benchTitle"></h2><span class="side" id="benchInfo"></span></div>
    <div class="body" id="benchBody"></div>
  </section>

  <section class="panel" id="talk">
    <div class="head"><h2 data-t="conversation"></h2><button class="toggle side" id="details"></button></div>
    <div class="body" id="logBox"><div id="log"></div></div>
  </section>
</main>

<script>
const TEXT = {
  es:{subtitle:"Laboratorio de electrónica", scope:"Osciloscopio", machine:"Máquina", benchTitle:"Circuito y diagnóstico",
      conversation:"Conversación", listening:"Escuchando", working:"Trabajando", speaking:"Hablando", microscope:"Microscopio",
      bench:"Banco", kinect:"Kinect", analysis:"Análisis IA", cnc:"CNC", arduino:"Arduino", noScope:"Osciloscopio no conectado",
      noMeasure:"Todavía no hay mediciones", simulated:"SIMULADO", shape:"Forma", mean:"Media", freq:"Frecuencia", duty:"Ciclo",
      rise:"Subida", range:"Rango", div:"/div", ago:"hace", noCircuit:"No hay ningún circuito en el banco", supply:"alimentación",
      goals:"metas cumplidas", likely:"Explicaciones más probables", verdict:"Veredicto", probeHere:"Pon la punta en",
      touches:"toca", nets:"Redes: simulado y medido", net:"Red", sim:"Simulado", read:"Medido", board:"Arduino",
      asSimulated:"Lee como la simulación", notAsSimulated:"No lee como la simulación", serial:"Monitor serie",
      kinectOk:"Kinect confirma la posición", kinectOff:"Kinect ve el cabezal a", kinectNone:"Kinect todavía no confirmó la posición",
      hold:"Movimiento en pausa", doubtful:"Posición dudosa: los motores se liberaron", front:"frente", back:"fondo",
      board_:"placa", head_:"cabezal", mosaics:"mosaicos", details:"Ver detalles", hideDetails:"Ocultar detalles", you:"Erlan",
      lunes:"Lunes", noSignal:"Sin imagen", models:"Modelos Meta", api:"API", pc:"en la PC", new_:"Imagen nueva", clear:"Clara",
      noneTitle:"Sin señal"},
  en:{subtitle:"Electronics lab", scope:"Oscilloscope", machine:"Machine", benchTitle:"Circuit and diagnosis",
      conversation:"Conversation", listening:"Listening", working:"Working", speaking:"Speaking", microscope:"Microscope",
      bench:"Bench", kinect:"Kinect", analysis:"AI analysis", cnc:"CNC", arduino:"Arduino", noScope:"Oscilloscope not connected",
      noMeasure:"No measurements yet", simulated:"SIMULATED", shape:"Shape", mean:"Mean", freq:"Frequency", duty:"Duty",
      rise:"Rise", range:"Range", div:"/div", ago:"", noCircuit:"No circuit on the bench", supply:"supply",
      goals:"goals met", likely:"Likeliest explanations", verdict:"Verdict", probeHere:"Put the probe on",
      touches:"touches", nets:"Nets: simulated and measured", net:"Net", sim:"Simulated", read:"Measured", board:"Arduino",
      asSimulated:"Reads as simulated", notAsSimulated:"Does not read as simulated", serial:"Serial monitor",
      kinectOk:"Kinect confirms the position", kinectOff:"Kinect sees the head", kinectNone:"Kinect has not confirmed the position yet",
      hold:"Moves on hold", doubtful:"Position doubtful: the motors were released", front:"front", back:"back",
      board_:"board", head_:"head", mosaics:"mosaics", details:"Show details", hideDetails:"Hide details", you:"Erlan",
      lunes:"Lunes", noSignal:"No picture", models:"Meta models", api:"API", pc:"on the PC", new_:"New picture", clear:"Clear",
      noneTitle:"No signal"}
};
// The engine's sentences are in English, as the code is; they read in Spanish on the Spanish page.
const SPANISH = [
  ["works as designed", "funciona como se diseñó"],
  ["these faults would read the same and need a look instead: ", "estas fallas leen igual y hay que mirarlas: "],
  ["none of the typical faults (a wire in the wrong row, two faults, no supply?)", "ninguna de las fallas típicas (¿un cable en otra fila, dos fallas, sin alimentación?)"],
  ["these read the same at every net, so measuring cannot separate them: look at the parts (colour codes, a missing or loose lead)", "leen igual en todas las redes, así que medir no las separa: mira las piezas (código de colores, una pata suelta)"],
  ["no measurement left that separates these: look at the parts, or check the wiring", "ninguna medición separa estas opciones: mira las piezas o revisa el cableado"],
  [" open (broken or a lead not in its row)", " abierta (rota o con una pata fuera de su fila)"],
  [" shorted collector to emitter (a dead transistor)", " en corto entre colector y emisor (transistor muerto)"],
  [" shorted", " en corto"], [" ten times too big (", " diez veces más grande ("], [" ten times too small (", " diez veces más chica ("],
  [" instead of ", " en vez de "], [": the colour code read wrong?)", ": ¿código de colores mal leído?)"],
  [" the wrong way round", " al revés"], [" missing or not making contact", " falta o no hace contacto"],
  [" dead (the chip itself)", " muerto (el propio chip)"],
  [" not running its sketch (not uploaded, wrong board, or held in reset): every pin floats", " sin correr su programa (sin cargar, otra placa o en reset): todos los pines flotan"],
  [" stuck low (a dead pin, or shorted to GND on the board)", " pegado en bajo (pin muerto o en corto a GND)"],
  [" never driven (the sketch does not set it as an output, or it is wired to another pin)", " nunca manejado (el programa no lo pone como salida, o va a otro pin)"],
  ["no repeating period in this window: the signal may be slower than the window (lower the sample rate), irregular data, or noise", "sin un periodo que se repita en esta ventana: puede ser más lenta que la ventana, datos irregulares o ruido"],
  ["flat at about 0 V: the tip may not be touching, the ground clip may be off, or the node has no voltage", "plana en unos 0 V: la punta puede no tocar, puede faltar el clip de masa, o el punto no tiene voltaje"],
  ["the signal uses little of the range: a narrower range shows it finer", "la señal usa poco del rango: un rango más estrecho la muestra mejor"],
  ["the edges are faster than this sample rate resolves (normal for digital signals): the rise time is only an upper bound", "los flancos son más rápidos que esta velocidad de muestreo (normal en digital): la subida es solo un máximo"],
  [" or ", " o "]];
const say = text => lang === "es" ? SPANISH.reduce((t,[a,b]) => t.split(a).join(b), text || "") : text;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let lang = store.get("lunes.lang") || "es", T = TEXT[lang] || TEXT.es;
let lab = null, next = 0, seenVersion = -1, chosenAt = 0, view = "microscope", live = { speaking:false, busy:false, status:"" };

const VIEWS = [["microscope","/img/microscope.jpg",250], ["bench","/img/bench.jpg",500], ["kinect","/img/kinect.jpg",1200], ["analysis","/img/seen.jpg",0]];
const MODELS = [["Muse Spark","api","spark"], ["SAM 3.1","api","sam"], ["Omnilingual ASR","pc","ear"], ["MMS-TTS","pc","voice"], ["Muse Glimmer","pc","glimmer"]];

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function si(x, unit, digits=3){
  if (x === null || x === undefined) return "—";
  if (x === 0) return "0 " + unit;
  const a = Math.abs(x), p = [[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"]].find(s => a >= s[0]) || [1e-9,"n"];
  return parseFloat((x / p[0]).toPrecision(digits)) + " " + p[1] + unit;
}
const fixed = (x, n=2) => x === null || x === undefined ? "—" : Number(x).toFixed(n).replace("-", "−");
const age = s => s === null || s === undefined ? "" : (T.ago ? T.ago + " " : "") + (s < 90 ? Math.round(s) + " s" : Math.round(s / 60) + " min") + (T.ago ? "" : " ago");

function translate(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[e.dataset.t]);
  $("lang").textContent = lang === "es" ? "EN" : "ES";
  $("details").textContent = document.body.classList.contains("details") ? T.hideDetails : T.details;
  buildTabs(); showState(); if (lab) render(lab);
}
function buildTabs(){
  const box = $("tabs"); box.replaceChildren();
  for (const [name, path] of VIEWS){
    const b = el("button"); b.setAttribute("role","tab"); b.dataset.view = name; b.setAttribute("aria-selected", name === view);
    const i = el("img"); i.alt = ""; i.dataset.src = path; b.append(i, el("span","",T[name]));
    b.onclick = () => { view = name; chosenAt = Date.now(); select(); };
    box.append(b);
  }
  select(); thumbs();
}
function select(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  $("big").alt = T[view]; $("badge").hidden = view !== "analysis" || !$("badge").textContent; drawOverlay(); pump();
}
let pumpTimer = 0;
function pump(){
  clearTimeout(pumpTimer);
  const v = VIEWS.find(x => x[0] === view), img = $("big");
  if (view === "analysis"){ if (seenVersion > 0) img.src = "/img/seen.jpg?v=" + seenVersion; else img.removeAttribute("src"); return; }
  const again = () => { if (v[0] === view) pumpTimer = setTimeout(pump, v[2]); };
  img.onload = img.onerror = again; img.src = v[1] + "?t=" + Date.now();
}
function thumbs(){
  document.querySelectorAll("#tabs img").forEach(i => {
    if (i.dataset.src.includes("seen")) { if (seenVersion > 0) i.src = "/img/seen.jpg?v=" + seenVersion; }
    else i.src = i.dataset.src + "?t=" + Date.now();
  });
}
function drawOverlay(){
  const svg = $("overlay"); svg.replaceChildren();
  const m = lab && lab.machine, stage = $("stage").getBoundingClientRect();
  $("caption").hidden = true;
  if (view !== "microscope" || !m || !m.px_per_mm || !stage.width) return;
  const [w,h] = m.image, k = Math.min(stage.width / w, stage.height / h), cx = stage.width / 2, cy = stage.height / 2;
  svg.setAttribute("viewBox", `0 0 ${stage.width} ${stage.height}`);
  const line = (x1,y1,x2,y2,c,sw) => { const l = document.createElementNS(NS,"line"); for (const [a,b] of Object.entries({x1,y1,x2,y2,stroke:c,"stroke-width":sw})) l.setAttribute(a,b); svg.append(l); };

const CH = { CH1:"#f5dc28", CH2:"#3cc8f0" };
function drawTrace(s){

  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext("2d"); g.scale(dpr,dpr);
  const w = r.width, h = r.height;
  g.clearRect(0,0,w,h); g.lineWidth = 1;
  for (let i=0;i<=10;i++){ const x = Math.round(i*(w-1)/10)+.5; g.strokeStyle = i===5?"#39444a":"#20282c"; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for (let j=0;j<=8;j++){ const y = Math.round(j*(h-1)/8)+.5; g.strokeStyle = j===4?"#39444a":"#20282c"; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  g.strokeStyle = "#39444a";
  for (let i=1;i<50;i++){ const x = i*(w-1)/50; g.beginPath(); g.moveTo(x,h/2-2); g.lineTo(x,h/2+2); g.stroke(); }
  for (let j=1;j<40;j++){ const y = j*(h-1)/40; g.beginPath(); g.moveTo(w/2-2,y); g.lineTo(w/2+2,y); g.stroke(); }
  if (!s.trace) return;
  for (const [ch,t] of Object.entries(s.trace.channels)){
    if (!(s.channels && s.channels[ch])) continue;
    const n = t.low.length, yOf = v => h/2 - v / t.range_v * h/2;
    g.strokeStyle = CH[ch]; g.lineWidth = 1.4; g.lineJoin = "round"; g.beginPath();
    for (let i=0;i<n;i++){ const x = i*(w-1)/(n-1); g.moveTo(x,yOf(t.low[i])); g.lineTo(x,Math.min(yOf(t.high[i]),yOf(t.low[i])-.6)); if (i){ const px=(i-1)*(w-1)/(n-1); g.moveTo(px,yOf((t.low[i-1]+t.high[i-1])/2)); g.lineTo(x,yOf((t.low[i]+t.high[i])/2)); } }

}
function renderScope(s){
  const note = $("scopeNote"); $("scopeSim").hidden = !s.simulated; $("scopeSim").textContent = T.simulated;

  drawTrace(s);

  if (!s.channels){ $("scopeInfo").textContent = s.connected ? `x${s.probe.CH1} · x${s.probe.CH2}` : ""; return; }
  const t = s.trace;
  $("scopeInfo").textContent = [t && si(t.seconds/10,"s") + T.div, s.rate && si(s.rate,"S/s"), age(s.ago_s)].filter(Boolean).join(" · ");
  const table = el("table"), head = el("tr");
  for (const k of ["", T.range, T.shape, "Vpp", T.mean, T.freq, T.duty, T.rise]) head.append(el("th",(k==="Vpp"||k===T.mean||k===T.freq||k===T.duty||k===T.rise)?"num":"",k));
  table.append(head);

    tr.append(el("td",ch.toLowerCase(),ch), el("td","num",si(m.range_v/4,"V") + T.div), el("td","",shapes[m.shape]||m.shape),
              el("td","num",si(m.vpp_v,"V")), el("td","num",si(m.mean_v,"V")), el("td","num",m.baud_if_uart ? m.baud_if_uart+" baud" : si(m.frequency_hz,"Hz",4)),
              el("td","num",m.duty===null||m.duty===undefined?"—":Math.round(m.duty*100)+" %"), el("td","num",si(m.rise_s,"s")));

function section(title){ const s = el("div","section"); if (title) s.append(el("h3","",title)); return s; }
function renderBench(d){

  $("benchInfo").textContent = c ? `${si(c.supply_v,"V")} ${T.supply}` : "";
  if (!c && !a){ body.replaceChildren(el("div","empty",T.noCircuit)); return; }

    const s = section(); s.append(el("div","name",c.name || ""));
    const list = c.parts.map(p => p.ref + (p.value !== undefined ? " " + p.value : p.model ? " " + p.model : p.color ? " " + p.color : "")).join(" · ");

      const track = el("div","track"), fill = el("i"); fill.style.width = (h.p*100)+"%"; track.append(fill); r.append(words, el("div","p",Math.round(h.p*100)+" %"), track); b.append(r); });

    table.append(head);
    const seen = {}; for (const r of (g && g.readings) || []) seen[r.net] = r;
    for (const [name,n] of Object.entries(c.nets)){

        const off = n.frequency_hz && r.frequency_hz ? Math.abs(r.frequency_hz/n.frequency_hz-1) > .2 : Math.abs(r.mean_v-n.mean_v) > .1+.05*Math.abs(n.mean_v);

      s.append(table); }
    if (a.serial && a.serial.length){ s.append(el("h3","",T.serial), el("div","serial",a.serial.slice(-6).join("\n"))); }

function render(d){ renderStrip(d); renderMachine(d.machine); renderScope(d.scope); renderBench(d); drawOverlay(); }

function addEvent(e){
  const log = $("log"), box = $("logBox"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  let n;
  if (e.kind === "tu" || e.kind === "lunes"){ n = el("div","msg" + (e.kind === "tu" ? " you" : "")); n.append(el("time","num",`${e.kind === "tu" ? T.you : T.lunes} · ${e.at}`), el("div","",e.text)); }
  else if (e.kind === "progress"){ n = el("div","msg progress",e.text); }
  else if (e.kind === "tool" || e.kind === "job"){ n = el("div","step",e.text); }
  else n = el("div","detail",`${e.at} ${e.text}`);
  log.append(n); if (atEnd) box.scrollTop = box.scrollHeight;
}
async function poll(){
  try {
    const r = await (await fetch("/events?since=" + next)).json();
    r.events.forEach(addEvent); next = r.next;
    live = { speaking:r.speaking, busy:r.busy, status:r.status }; showState();
    if (r.seen_version !== seenVersion){
      const fresh = seenVersion >= 0 && r.seen_version > 0; seenVersion = r.seen_version;
      $("badge").textContent = r.seen_label || ""; $("badge").hidden = view !== "analysis" || !r.seen_label;
      if (fresh && Date.now() - chosenAt > 30000){ view = "analysis"; select(); } else if (view === "analysis") pump();
      thumbs();
    }
    if (r.lab){ lab = r.lab; render(lab); }
  } catch (err) {}
  setTimeout(poll, 700);
}
